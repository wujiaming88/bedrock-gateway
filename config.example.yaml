# Bedrock Gateway example configuration
# Copy to config.yaml and customize.

# ─── Authentication ───────────────────────────────────────
# Supported modes: bearer_token | credentials | iam_role | profile
auth:
  mode: bearer_token
  bearer_token: ${AWS_BEARER_TOKEN_BEDROCK}

  # -- credentials mode --
  # mode: credentials
  # access_key_id: ${AWS_ACCESS_KEY_ID}
  # secret_access_key: ${AWS_SECRET_ACCESS_KEY}
  # session_token: ${AWS_SESSION_TOKEN}  # optional

  # -- iam_role mode (auto from EC2/ECS/Lambda) --
  # mode: iam_role

  # -- profile mode (AWS CLI profile) --
  # mode: profile
  # profile: default

# ─── Region ───────────────────────────────────────────────
region: us-east-1

# ─── Server ───────────────────────────────────────────────
server:
  host: 127.0.0.1
  port: 4000
  log_level: info   # debug | info | warning | error
  # api_key: ${BEDROCK_API_KEY}  # uncomment to require authentication

# ─── Logging ───────────────────────────────────────────────
# Console output remains enabled for journald/container logs. When file logging
# is enabled, all gateway, Uvicorn access/error, and httpx logs also go to a
# local-date file named bedrock-gateway-YYYY-MM-DD.log.
logging:
  file_enabled: true
  directory: /var/log/bedrock-gateway
  retention_days: 30

# ─── Retry / upstream-call tuning ─────────────────────────
retry:
  max_retries: 3
  base_delay: 1.0   # seconds, exponential backoff: delay * 2^attempt
  timeout: 300      # seconds per upstream attempt (connect + read); raise for
                    # slow reasoning models, lower to fail fast. Env: BEDROCK_TIMEOUT

# ─── Dashboard ────────────────────────────────────────────
# Observability UI at /dashboard/ and the /api/metrics/* JSON API.
# The dashboard has its own API key, independent of server.api_key —
# model clients cannot access the dashboard, and dashboard operators
# cannot call the model endpoints.
# When dashboard.api_key is set the dashboard requires it (cookie, Bearer,
# x-api-key, or ?key=). When it is not set the dashboard restricts itself
# to localhost unless `localhost_only: false` is set explicitly.
dashboard:
  enabled: true                       # expose the dashboard at all?
  api_key: ${BEDROCK_DASHBOARD_KEY}   # dashboard auth, independent of server.api_key
  require_auth: true                  # require API key when one is configured
  # localhost_only: false             # set true/false to override the default
  rate_limit: 60                      # /api/metrics/* requests/minute/IP
  max_request_log: 200                # rows retained in the request-log panel
  storage:
    enabled: true                     # persist metrics to SQLite so they survive restarts
    path: data/metrics.db             # database file location (relative to CWD)
    retain_days: 7                    # drop rows older than this many days

# ─── Models ───────────────────────────────────────────────
# Map user-facing aliases to model IDs. This section MERGES with the built-in
# defaults (Claude family + GPT-5.5 + Grok): entries here are added on top, and
# an entry sharing a default's alias overrides it. So you only need to list what
# you want to ADD or CHANGE — omit the section entirely to use just the defaults.
# Set `use_default_models: false` to start from empty and expose ONLY the models
# configured here.
# use_default_models: false
models:
  claude-opus-4.7:
    bedrock_id: us.anthropic.claude-opus-4-7
    context_length: 1000000
    max_output: 128000

  claude-opus-4:
    bedrock_id: us.anthropic.claude-opus-4-6-v1
    context_length: 1000000
    max_output: 128000

  claude-sonnet-4.6:
    bedrock_id: us.anthropic.claude-sonnet-4-6
    context_length: 1000000
    max_output: 64000

  claude-haiku:
    bedrock_id: us.anthropic.claude-haiku-4-5-20251001-v1:0
    context_length: 200000
    max_output: 64000

  # ── OpenAI GPT-5.5 ──────────────────────────────────────
  # Reached via the bedrock-mantle endpoint's OpenAI Responses API
  # (NOT bedrock-runtime). Exposed on POST /openai/v1/responses (native
  # Responses passthrough) AND on POST /v1/messages (Anthropic Messages, auto-
  # translated to Responses) — the latter lets Claude Code / Anthropic-only
  # clients drive it via ANTHROPIC_BASE_URL + ANTHROPIC_MODEL=gpt-5.5.
  # endpoint/protocol default to runtime/anthropic when omitted, so existing
  # entries above are unaffected.
  gpt-5.5:
    bedrock_id: openai.gpt-5.5
    context_length: 1050000       # OpenAI official spec (Bedrock card lists 272K)
    max_output: 128000
    endpoint: mantle              # runtime (default) | mantle
    protocol: openai-responses    # anthropic (default) | openai-responses

  # ── OpenAI GPT-5.6 family ───────────────────────────────
  # Live-probed on Bedrock mantle: Sol / Terra / Luna all return HTTP 200.
  # Bedrock mantle exposes a 1M context window for all three variants.
  # Max output remains advisory until a model card publishes a specific limit.
  gpt-5.6-sol:
    bedrock_id: openai.gpt-5.6-sol
    context_length: 1000000
    max_output: 128000
    endpoint: mantle
    protocol: openai-responses
  gpt-5.6-terra:
    bedrock_id: openai.gpt-5.6-terra
    context_length: 1000000
    max_output: 128000
    endpoint: mantle
    protocol: openai-responses
  gpt-5.6-luna:
    bedrock_id: openai.gpt-5.6-luna
    context_length: 1000000
    max_output: 128000
    endpoint: mantle
    protocol: openai-responses

  # ── OpenAI GPT-6 Astra ──────────────────────────────────
  # Live-probed on Bedrock mantle (HTTP 200). Mantle serves GPT-6 Astra only
  # from us-west-2, so this model pins its region (like Grok 4.6 below).
  gpt-6-astra:
    bedrock_id: openai.gpt-6-astra
    context_length: 1050000
    max_output: 128000
    endpoint: mantle
    protocol: openai-responses
    region: us-west-2
  # Chat-completions twin (same upstream, openai-chat dialect). The upstream
  # rejects `max_tokens`; the gateway auto-renames it to `max_completion_tokens`
  # on that 400, so standard OpenAI chat clients work unchanged.
  gpt-6-astra-chat:
    bedrock_id: openai.gpt-6-astra
    context_length: 1050000
    max_output: 128000
    endpoint: mantle
    dialect: openai-chat
    region: us-west-2

  # ── xAI Grok ────────────────────────────────────────────
  # Same mantle + Responses protocol as GPT-5.x. Grok 4.6 mantle is available
  # in-region only from us-west-2, so its model-level region overrides the
  # gateway-wide default without affecting any other model.
  grok-4.3:
    bedrock_id: xai.grok-4.3
    context_length: 1000000
    max_output: 131072
    endpoint: mantle
    protocol: openai-responses
  grok-4.6:
    bedrock_id: xai.grok-4.6
    context_length: 500000
    max_output: 131072
    endpoint: mantle
    protocol: openai-responses
    region: us-west-2

  # ── OpenAI-compatible Embeddings on Bedrock runtime ──────
  # Same /v1/embeddings endpoint, different adapter profiles. Cohere separates
  # document/query vector spaces (plus classification/clustering); Titan is
  # symmetric and fans out string arrays with bounded concurrency while
  # preserving OpenAI response ordering.
  #
  # -document / -query fix the task by model name and stay standard OpenAI
  # (no input_type). The bare cohere-embed-v4 is the *dynamic* profile: it
  # requires the OpenClaw input_type extension (query | document |
  # classification | clustering) and maps it to Cohere's native input_type.
  # Titan is symmetric and rejects any input_type.
  cohere-embed-v4-document:
    bedrock_id: cohere.embed-v4:0
    context_length: 128000
    max_output: 1024
    endpoint: runtime
    dialect: openai-embeddings
    embedding_profile: cohere-embed-v4-document
  cohere-embed-v4-query:
    bedrock_id: cohere.embed-v4:0
    context_length: 128000
    max_output: 1024
    endpoint: runtime
    dialect: openai-embeddings
    embedding_profile: cohere-embed-v4-query
  cohere-embed-v4:
    bedrock_id: cohere.embed-v4:0
    context_length: 128000
    max_output: 1024
    endpoint: runtime
    dialect: openai-embeddings
    embedding_profile: cohere-embed-v4
  titan-embed-text-v2:
    bedrock_id: amazon.titan-embed-text-v2:0
    context_length: 8192
    max_output: 1024
    endpoint: runtime
    dialect: openai-embeddings
    embedding_profile: amazon-titan-embed-v2

  # ── Azure OpenAI models (see azure_resources below) ─────
  # Two orthogonal axes describe every model:
  #   transport: bedrock (default) | azure    — where + how to auth
  #   dialect:   anthropic (default) | openai-responses | openai-chat | openai-images
  # Azure models reference an azure_resources entry (endpoint + key) and set a
  # deployment name (goes into the upstream request body's "model" field).
  #
  # azure-gpt-5:                    # exposed on POST /openai/v1/responses
  #   transport: azure
  #   dialect: openai-responses
  #   azure_resource: my-azure      # ← key in azure_resources
  #   deployment: gpt-5             # ← your Azure deployment name
  # azure-gpt-4o:                   # exposed on POST /v1/chat/completions
  #   transport: azure
  #   dialect: openai-chat
  #   azure_resource: my-azure
  #   deployment: gpt-4o

# ─── Azure OpenAI resources ───────────────────────────────
# One entry per Azure OpenAI resource. Credentials are resource-scoped: each
# resource has its own endpoint + api-key (keys are NOT interchangeable across
# resources). One resource can host many deployments sharing this endpoint/key.
# Recommended base_url is the v1 API root (.../openai/v1): it serves BOTH the
# Responses and Chat Completions dialects with no api-version needed, so a
# single resource entry covers all your deployments. (A legacy base with
# ?api-version=... is still supported — any query string is preserved.)
#
# `prefix` (optional) enables PASSTHROUGH-BY-MODEL-PREFIX: set prefix: azure and
# any client model `azure/<deployment>` is routed to this resource with
# <deployment> as the Azure deployment name — NO per-model entry needed. The
# dialect is picked by the endpoint hit (/openai/v1/responses → responses,
# /v1/chat/completions → chat, /openai/v1/images/generations|edits → images). This is
# the lightest way to expose a whole Azure resource: configure it once, then call
# azure/<anything> as your deployments
# come and go. (You can still register explicit models in `models:` too.)
# azure_resources:
#   my-azure:
#     base_url: https://<resource>.cognitiveservices.azure.com/openai/v1
#     api_key: ${AZURE_OPENAI_KEY}
#     prefix: azure        # → call model "azure/<your-deployment>"

# ─── Generic HTTP upstream resources ───────────────────────
# One resource may expose several native wire protocols. The gateway only
# selects the route, injects that upstream's credential, and replaces `model`;
# requests/responses/SSE otherwise pass through unchanged.
#
# DeepSeek official API example (formal APIs only; Beta/FIM are not included):
# upstream_resources:
#   deepseek:
#     prefix: deepseek
#     secret_env: DEEPSEEK_API_KEY
#     routes:
#       openai-chat:
#         base_url: https://api.deepseek.com
#         path: /chat/completions
#         auth: bearer
#       openai-responses:
#         base_url: https://api.deepseek.com
#         path: /responses
#         auth: bearer
#       anthropic-passthrough:
#         base_url: https://api.deepseek.com/anthropic
#         path: /v1/messages
#         auth: x-api-key
#         default_headers:
#           anthropic-version: "2023-06-01"
# models:
#   deepseek-v4-flash:
#     upstream_resource: deepseek
#     upstream_id: deepseek-v4-flash
#     dialect: openai-chat       # default route; endpoint selects other routes
#     context_length: 1000000
#     max_output: 393216
#   deepseek-v4-pro:
#     upstream_resource: deepseek
#     upstream_id: deepseek-v4-pro
#     dialect: openai-chat
#     context_length: 1000000
#     max_output: 393216
#
# OpenRouter example — OpenAI-compatible aggregator (keys start `sk-or-v1-`).
# Unlike DeepSeek, OpenRouter uses Bearer auth on ALL three endpoints (its
# native /messages accepts Bearer, not x-api-key). The `prefix` enables
# passthrough: any client model `openrouter/<vendor>/<model>` routes straight
# through with NO named alias — e.g. `openrouter/anthropic/claude-opus-4.6`,
# `openrouter/openai/gpt-5.5`, `openrouter/google/gemini-2.5-pro`.
# upstream_resources:
#   openrouter:
#     prefix: openrouter
#     secret_env: OPENROUTER_API_KEY
#     routes:
#       openai-chat:
#         base_url: https://openrouter.ai/api/v1
#         path: /chat/completions
#         auth: bearer
#       openai-responses:
#         base_url: https://openrouter.ai/api/v1
#         path: /responses
#         auth: bearer
#       anthropic-passthrough:
#         base_url: https://openrouter.ai/api/v1
#         path: /messages
#         auth: bearer
#         default_headers:
#           anthropic-version: "2023-06-01"
#
# Volcano Engine Ark (火山方舟) example — ByteDance's OpenAI-compatible
# platform (Doubao/豆包 + hosted DeepSeek/Kimi/GLM). Bearer auth on all three
# endpoints; Chat/Responses share the /api/v3 root, Anthropic Messages lives
# under /api/compatible/v1. `prefix` enables passthrough: `ark/<model>` with NO
# named alias. Models must be activated in the Ark console first (else 404
# ModelNotOpen). `doubao-seed-evolving` is an alias that resolves to
# `doubao-seed-evolving-latest-version` upstream.
# upstream_resources:
#   ark:
#     prefix: ark
#     secret_env: ARK_API_KEY
#     routes:
#       openai-chat:
#         base_url: https://ark.cn-beijing.volces.com/api/v3
#         path: /chat/completions
#         auth: bearer
#       openai-responses:
#         base_url: https://ark.cn-beijing.volces.com/api/v3
#         path: /responses
#         auth: bearer
#       anthropic-passthrough:
#         base_url: https://ark.cn-beijing.volces.com/api/compatible/v1
#         path: /messages
#         auth: bearer
#         default_headers:
#           anthropic-version: "2023-06-01"
# models:
#   doubao-seed-evolving:
#     upstream_resource: ark
#     upstream_id: doubao-seed-evolving
#     dialect: openai-chat
#     context_length: 1024000
#     max_output: 256000
#   doubao-seed-2-1-pro-260628:
#     upstream_resource: ark
#     upstream_id: doubao-seed-2-1-pro-260628
#     dialect: openai-chat
#     context_length: 256000
#     max_output: 256000
#   deepseek-v4-pro-ga-260813:
#     upstream_resource: ark
#     upstream_id: deepseek-v4-pro-ga-260813
#     dialect: openai-chat
#     context_length: 1000000
#     max_output: 393216
#
# Alibaba Cloud Bailian (百炼 / DashScope) example — Alibaba's OpenAI-compatible
# platform hosting Qwen + third-party models (DeepSeek, Kimi, Zhipu GLM) under
# one DASHSCOPE_API_KEY. Bearer auth on all three endpoints; Chat/Responses
# share the /compatible-mode/v1 root, Anthropic Messages lives under
# /apps/anthropic/v1/messages. Model IDs match the DashScope console: Qwen/Kimi/
# DeepSeek are bare (`kimi-k3`), Zhipu GLM keeps its `ZHIPU/` prefix. GLM-5.3-Flash
# is Chat-only on Bailian (its Responses-compatible endpoint rejects the standard
# `input` field; it is not exposed on the Anthropic-compatible endpoint).
# `prefix: qwen` enables PASSTHROUGH-BY-MODEL-PREFIX: any client model
# `qwen/<model>` routes to this resource with <model> as the upstream ID — e.g.
# `qwen/qwen3.8-max`, `qwen/kimi-k3`, `qwen/ZHIPU/GLM-5.3-Flash` — with no
# per-model entry needed (bare aliases in `models:` still work too).
# upstream_resources:
